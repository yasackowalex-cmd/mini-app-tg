<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Банк задач ЕГЭ по физике · Саня дай сотку</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231B1F3B%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22%23FF6B35%22 font-family=%22sans-serif%22 font-weight=%22bold%22%3E100%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="web/katex/katex.min.css?v=260143a6">
<link rel="stylesheet" href="web/style.css?v=2b6bf30d">
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap head">
    <a class="logo" href="./"><img src="web/logo-white.svg" alt="Саня дай сотку"></a>
    <div>
      <div class="brand">САНЯ ДАЙ СОТКУ</div>
      <h1>Банк задач ЕГЭ по физике</h1>
      <p id="hello" class="hello" hidden></p>
    </div>
  </div>
</header>

<main class="wrap">
  <form id="profile" class="profile" hidden>
    <h2>Давайте познакомимся</h2>
    <p class="muted">Фамилию и класс увидит только учитель, когда будет проверять домашние задания.</p>
    <div class="row">
      <label>Фамилия <input name="last_name" maxlength="50" autocomplete="family-name" required></label>
      <label>Класс <input name="grade" maxlength="10" placeholder="11А" autocomplete="off" required></label>
    </div>
    <button name="save" class="btn solid" type="submit">Сохранить</button>
    <span class="msg" role="status"></span>
  </form>

  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-tab="bank" aria-pressed="true">Банк задач</button>
    <button type="button" data-tab="teacher" aria-pressed="false">Кабинет учителя</button>
  </nav>

  <section id="teacher" class="teacher" hidden>
    <div class="t-bar">
      <div class="seg">
        <button type="button" data-view="hw" aria-pressed="true">Домашние задания</button>
        <button type="button" data-view="students" aria-pressed="false">Ученики</button>
        <button type="button" data-view="exams" aria-pressed="false">Пробники</button>
      </div>
      <div class="t-filters">
        <select id="t-grade" aria-label="Класс"></select>
        <input id="t-q" type="search" placeholder="Поиск: ДЗ или фамилия" autocomplete="off">
      </div>
    </div>
    <div id="t-body"><p class="status">Загружаю…</p></div>
  </section>

  <div id="bank-area">
  <a class="exam-link" href="exam.html"><span><b>Пробный вариант ЕГЭ</b><br>26 заданий на время, баллы как на экзамене</span><i>Решать →</i></a>
  <details id="hw" class="progress hw" hidden>
    <summary>Домашние задания</summary>
    <div id="hw-body"></div>
  </details>

  <details id="progress" class="progress" hidden>
    <summary>Мой прогресс</summary>
    <div id="progress-body"></div>
  </details>

  <section class="filters" aria-label="Фильтры">
    <input id="q" type="search" placeholder="Поиск по тексту условия" autocomplete="off">
    <div class="selects">
      <label>Раздел <select id="f-section"></select></label>
      <label>Тема <select id="f-topic"></select></label>
      <label>№ КИМ <select id="f-kim"></select></label>
      <label>Уровень <select id="f-level"></select></label>
      <label>Тип <select id="f-type"></select></label>
      <label>Экзамен <select id="f-exam"></select></label>
    </div>
    <div class="summary"><span id="count"></span> <button id="reset" type="button" class="link">Сбросить фильтры</button>
      <button id="pick-all" type="button" class="link" hidden></button></div>
  </section>

  <div id="viewbar" class="viewbar" hidden><span id="view-title"></span> <button id="view-close" type="button" class="link">Ко всем задачам</button></div>
  <section id="list" aria-live="polite"></section>
  <div class="more-wrap"><button id="more" type="button" class="btn" hidden>Показать ещё</button></div>
  <p id="status" class="status">Загружаю банк…</p>
  </div>
</main>

<div id="pickbar" class="pickbar" hidden>
  <div class="wrap">
    <span id="pick-count"></span>
    <a id="pick-open" class="btn solid" target="_blank" rel="noopener">Открыть для печати</a>
    <button id="pick-clear" type="button" class="link">Очистить</button>
    <button id="hw-new" type="button" class="btn solid orange" hidden>Задать как ДЗ</button>
  </div>
  <form id="hw-form" class="wrap hw-form" hidden>
    <input name="title" maxlength="100" placeholder="Название, например «ДЗ к 22 октября»" autocomplete="off">
    <button class="btn solid" type="submit">Создать ссылку</button>
    <span class="msg" role="status"></span>
  </form>
</div>

<script src="web/katex/katex.min.js?v=a43bf9e2"></script>
<script src="web/tex.js?v=da6f3fcc"></script>
<script src="web/render.js?v=51db5bc5"></script>
<script src="web/app.js?v=02e24ad8"></script>
<script src="web/hw.js?v=fdfd8f8e"></script>
<script src="web/teacher.js?v=b8d91f21"></script>
<script defer src="web/tg.js?v=ad067407"></script>
</body>
</html>
