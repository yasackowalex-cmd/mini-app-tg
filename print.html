<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подборка задач · Саня дай сотку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="web/katex/katex.min.css?v=260143a6">
<link rel="stylesheet" href="web/style.css?v=0adae7a9">
<link rel="stylesheet" href="web/print.css?v=bae60167">
</head>
<body class="sheet-page">
<div class="controls">
  <div class="wrap">
    <label class="title-in">Заголовок <input id="title" value="Домашнее задание" autocomplete="off"></label>
    <div class="opts">
      <label><input type="checkbox" id="o-name" checked> Строка для имени</label>
      <label><input type="checkbox" id="o-kim" checked> Номер КИМ у задачи</label>
      <label><input type="checkbox" id="o-id" checked> Номер задачи на сайте</label>
      <label><input type="checkbox" id="o-line" checked> Поле «Ответ» (часть 1)</label>
      <label><input type="checkbox" id="o-ans" checked> Ответы в конце</label>
      <label><input type="checkbox" id="o-sol"> Решения в конце</label>
    </div>
    <div class="actions">
      <button id="print" type="button" class="btn solid">Печать / сохранить PDF</button>
      <button id="copy" type="button" class="btn">Скопировать ссылку</button>
      <a class="btn" href="./">К банку задач</a>
      <span id="msg" class="muted"></span>
    </div>
    <p class="muted small">В окне печати выберите «Сохранить как PDF». Кнопкой ✕ задачу можно убрать из подборки.</p>
  </div>
</div>

<main class="sheet">
  <header class="sheet-head">
    <div>
      <div class="brand">САНЯ ДАЙ СОТКУ · ФИЗИКА</div>
      <h1 id="h-title"></h1>
      <p id="h-name" class="name-line">Фамилия, имя ______________________________ &nbsp; Дата ____________</p>
    </div>
    <img class="sheet-logo" src="web/logo.svg" alt="Саня дай сотку">
  </header>
  <ol id="tasks" class="tasks"></ol>
  <section id="answers" class="answers"></section>
  <section id="solutions" class="solutions"></section>
  <p id="status" class="status">Загружаю задачи…</p>
</main>

<script src="web/katex/katex.min.js?v=a43bf9e2"></script>
<script src="web/tex.js?v=db2f214f"></script>
<script src="web/render.js?v=2cfeb21d"></script>
<script src="web/print.js?v=e91aa792"></script>
</body>
</html>
